name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Match the tag to flake.nix
        run: |
          package_version=$(sed -nE 's/^[[:space:]]*version = "([^"]+)";$/\1/p' flake.nix | head -1)
          test -n "$package_version"
          test "$GITHUB_REF_NAME" = "v$package_version"

  release:
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
